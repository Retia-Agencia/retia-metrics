name: Leer respuestas de Form30x

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  leer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Llamar al cron del CRM
        run: |
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.CRM_URL }}/api/cron/form30x"
