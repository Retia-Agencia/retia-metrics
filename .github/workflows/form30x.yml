name: Leer respuestas de Form30x

# El horario vive en pg_cron (job `leer-form30x`, migracion 0092): el schedule de GitHub
# corrio una vez en 11 h el 16-oct. Esto queda solo para dispararlo a mano.
on:
  workflow_dispatch:

jobs:
  leer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Llamar al cron del CRM
        run: |
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.CRM_URL }}/api/cron/form30x"
