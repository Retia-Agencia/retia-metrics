# Ticket 112: los cuatro chequeos de AGENTS.md (test, typecheck, lint, build) en cada PR y
# en cada push a `main`, con `npm ci` sobre el lock. Nada de esto necesita `.env.local`:
# los tests usan PGlite y un Postgres local para la concurrencia entre conexiones.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chequeos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  # 14-oct: la suite en un solo job llego a 462 s y una corrida se corto en los 480 s de
  # scripts/test.mjs sin un test rojo. Partida en 3, cada parte corre en su propio runner.
  # El checkpoint es verde solo si las 3 lo son.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: retia_pruebas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d retia_pruebas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL_PRUEBA_POSTGRES: postgresql://postgres:postgres@127.0.0.1:5432/retia_pruebas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- --shard=${{ matrix.shard }}/3
