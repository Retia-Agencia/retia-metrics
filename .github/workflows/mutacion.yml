# Auditoría de mutación por módulo crítico (docs/agents/tests.md). Manual: no corre en cada PR
# porque cada mutante re-ejecuta los tests que lo cubren. Compara el reporte de `main` con el de
# una rama que recorta tests: si sobreviven mutantes nuevos, el recorte quitó protección.
name: Mutación

on:
  workflow_dispatch:
    inputs:
      modulos:
        description: "Módulos de lib/ a mutar, separados por coma"
        default: "lib/deals/mover-etapa.ts,lib/queries/metricas-con-filas.ts,lib/queries/vigente.ts,lib/queries/saldo.ts"

permissions:
  contents: read

jobs:
  matriz:
    runs-on: ubuntu-latest
    outputs:
      modulos: ${{ steps.m.outputs.modulos }}
    steps:
      - id: m
        env:
          MODULOS: ${{ inputs.modulos }}
        run: echo "modulos=$(jq -cn --arg s "$MODULOS" '$s | split(",") | map(gsub("^ +| +$"; ""))')" >> "$GITHUB_OUTPUT"

  mutacion:
    needs: matriz
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        modulo: ${{ fromJson(needs.matriz.outputs.modulos) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx stryker run
        env:
          MUTAR: ${{ matrix.modulo }}
      - id: nombre
        if: always()
        env:
          MODULO: ${{ matrix.modulo }}
        run: echo "n=$(echo "$MODULO" | tr '/.' '--')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutacion-${{ steps.nombre.outputs.n }}
          path: reports/mutation
